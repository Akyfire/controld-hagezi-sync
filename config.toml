# =============================================================================
# ControlD Hagezi Sync — Configuration
# =============================================================================
# Copy this file to config.toml and customize it.
# DO NOT commit config.toml if it contains your API token.
# =============================================================================

[settings]
# Your ControlD API Write Token.
# Get it from: https://controld.com/dashboard/api
# You can also leave this empty and use the CONTROLD_API_TOKEN env var.
api_token = ""

# Uncomment to skip the upstream freshness report at the end of each sync run.
# This avoids unauthenticated GitHub API calls (60 req/hr limit) — useful for CI.
# show_freshness = false

# Set to true to preview changes without modifying anything.
dry_run = false

# Uncomment to override the fallback mirror base URL.
# Default: https://hagezi-mirror.dnsbunker.org/controld
# Only needed if you host your own mirror or the default changes.
# hagezi_mirror_base = "https://hagezi-mirror.dnsbunker.org/controld"

[profiles]
# Exact names of your ControlD profiles (case-sensitive).
names = ["Normal", "Pro"]

# =============================================================================
# FOLDER DEFINITIONS
# =============================================================================
# Each line under [folders] maps a friendly name → Hagezi JSON URL.
# The friendly name is what appears in your ControlD dashboard.
# =============================================================================

[folders]
"Apple Private Relay Allow" = "https://raw.github.com/hagezi/dns-blocklists/blob/main/controld/apple-private-relay-allow-folder.json"
"Badware Hoster"         = "https://raw.github.com/hagezi/dns-blocklists/blob/main/controld/badware-hoster-folder.json"
"Meta Tracker Allow"     = "https://raw.githubusercontent.com/hagezi/dns-blocklists/main/controld/meta-tracker-allow-folder.json"
"Microsoft Allow"        = "https://raw.github.com/hagezi/dns-blocklists/blob/main/controld/microsoft-allow-folder.json"
"Native Amazon Tracker"  = "https://raw.github.com/hagezi/dns-blocklists/blob/main/controld/native-tracker-amazon-folder.json"
"Native Apple Tracker" = "https://raw.github.com/hagezi/dns-blocklists/blob/main/controld/native-tracker-apple-folder.json"
"Native Huawei Tracker" = "https://raw.github.com/hagezi/dns-blocklists/blob/main/controld/native-tracker-huawei-folder.json"
"Native LG WebOS Tracker" = "https://raw.github.com/hagezi/dns-blocklists/blob/main/controld/native-tracker-lgwebos-folder.json"
"Native Microsoft Tracker" = "https://raw.github.com/hagezi/dns-blocklists/blob/main/controld/native-tracker-microsoft-folder.json"
"Native Oppo Realme Tracker" = "https://github.com/hagezi/dns-blocklists/blob/main/controld/native-tracker-oppo-realme-folder.json"
"Native Roku Tracker" = "https://raw.github.com/hagezi/dns-blocklists/blob/main/controld/native-tracker-roku-folder.json"
"Native Samsung Tracker" = "https://raw.github.com/hagezi/dns-blocklists/blob/main/controld/native-tracker-samsung-folder.json"
"Native Tiktok Tracker" = "https://raw.github.com/hagezi/dns-blocklists/blob/main/controld/native-tracker-tiktok-folder.json"
"Native Tiktok Aggressive Tracker" = "https://raw.github.com/hagezi/dns-blocklists/blob/main/controld/native-tracker-tiktok-aggressive-folder.json"
"Native Vivo Tracker" = "https://raw.github.com/hagezi/dns-blocklists/blob/main/controld/native-tracker-vivo-folder.json"
"Native Xiaomi Tracker" = "https://raw.github.com/hagezi/dns-blocklists/blob/main/controld/native-tracker-xiaomi-folder.json"

# =============================================================================
# PROFILE → FOLDER MAPPINGS
# =============================================================================
# For each profile, list which folders (by friendly name) it should receive.
# Use the exact names from the [folders] section above.
# =============================================================================

[profile_folders]
Normal   = ["Badware Hoster", "Microsoft Allow", "Native Amazon Tracker", "Native Apple Tracker", "Native Huawei Tracker","Native LG WebOS Tracker"]
Pro      = ["Badware Hoster", "Microsoft Allow", "Native Amazon Tracker", "Native Apple Tracker", "Native Huawei Tracker","Native LG WebOS Tracker"]
